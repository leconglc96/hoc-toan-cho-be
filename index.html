<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Toán Mầm Non - Học Mà Chơi</title>
  <style>
    :root {
      --primary-color: #FF5252;
      --secondary-color: #4A90E2;
      --accent-color: #2ECC71;
      --text-color: #2D3748;
      --correct-color: #2ECC71;
      --wrong-color: #FF4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #E0F7FA 0%, #FFF9C4 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      position: relative;
    }

    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      flex-shrink: 0;
    }

    h1 {
      font-family: Arial, sans-serif;
      font-weight: bold;
      color: #FF4757;
      font-size: 1.3rem;
      text-shadow: 1px 1px 0px #FFF, 2px 2px 0px rgba(0,0,0,0.1);
      white-space: nowrap;
    }

    .tab-container {
      display: flex;
      gap: 6px;
    }

    .tab-button {
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 6px 12px;
      border: 2px solid #FFF;
      border-radius: 18px;
      background: var(--secondary-color);
      color: white;
      cursor: pointer;
      box-shadow: 0 3px 0 #2980B9, 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .tab-button:nth-child(2) {
      background: #FF6B6B;
      box-shadow: 0 3px 0 #C0392B, 0 4px 6px rgba(0,0,0,0.1);
    }

    .tab-button:nth-child(3) {
      background: #2ECC71;
      box-shadow: 0 3px 0 #27AE60, 0 4px 6px rgba(0,0,0,0.1);
    }

    .tab-button.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
      filter: brightness(1.1);
    }

    .game-area {
      width: 100%;
      max-width: 960px;
      height: calc(100vh - 60px);
      background: rgba(255, 255, 255, 0.94);
      border-radius: 16px;
      padding: 8px 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border: 2px solid #FFF;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .instruction {
      font-size: 0.9rem;
      font-weight: bold;
      color: #2C3E50;
      text-align: center;
      background: #FFF9C4;
      padding: 4px 14px;
      border-radius: 10px;
      border: 2px dashed #FBC02D;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #content-container {
      width: 100%;
      height: calc(100% - 34px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
    }

    .flashcard {
      background: #FFFFFF;
      border-radius: 16px;
      border: 3px solid #E0E0E0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color 0.2s;
    }

    .question-card {
      padding: 4px 16px;
      width: 58%;
      max-width: 440px;
      height: 38%;
      font-size: 2.5rem;
      font-weight: bold;
      color: #2C3E50;
      border-color: #4A90E2;
      background: linear-gradient(180deg, #EBF5FB 0%, #FFFFFF 100%);
    }

    .question-card.match-mode {
      border-color: #FF9800;
      background: linear-gradient(180deg, #FFF8E1 0%, #FFFFFF 100%);
      width: 42%;
      height: 42%;
    }

    .objects-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .item-img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.15));
      animation: popIn 0.3s ease-out;
    }

    .item-img-large {
      width: 65px;
      height: 65px;
      object-fit: contain;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.18));
    }

    .answers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 90%;
      max-width: 780px;
      height: 48%;
    }

    .answer-card {
      height: 100%;
      cursor: pointer;
      font-size: 2rem;
      font-weight: bold;
      color: #2C3E50;
      border-color: #FF8A80;
      background: #FFF;
      box-shadow: 0 4px 0 #FFCDD2, 0 6px 10px rgba(0,0,0,0.08);
      transition: transform 0.15s;
    }

    .answer-card:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #FFCDD2;
    }

    .answer-card.match-card {
      font-size: 0.85rem;
      font-weight: bold;
      color: #2C3E50;
      padding: 4px;
    }

    .answer-card.correct {
      border-color: var(--correct-color) !important;
      background-color: #E8F5E9 !important;
      animation: spinCard 0.75s ease-in-out 2 forwards !important;
    }

    .answer-card.wrong {
      border-color: var(--wrong-color) !important;
      background-color: #FFEBEE !important;
      animation: bounceCard 0.35s ease-in-out 2 !important;
    }

    @keyframes spinCard {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes bounceCard {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-8px); }
      75% { transform: translateY(4px); }
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    #svg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .label-text {
      margin-top: 3px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #2C3E50;
      text-align: center;
    }

    .baby-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(3px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .baby-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .baby-box {
      background: white;
      padding: 16px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 4px solid #4ECDC4;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.35s ease-out;
    }

    .baby-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .baby-title {
      font-weight: bold;
      font-size: 1.3rem;
      margin-top: 8px;
    }

    .baby-title.happy { color: #2ECC71; }
    .baby-title.sad { color: #FF4757; }
  </style>
</head>

  <header>
    <h1>TOÁN MẦM NON</h1>
    <div class="tab-container">
      <button class="tab-button active" onclick="switchMode(1)">1. Phép Tính</button>

  <script>
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTingTing() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(987.77, now);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.3);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1318.51, now + 0.15);
      gain2.gain.setValueAtTime(0.4, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.6);
    }

    function playDetDet() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(150, now);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.2);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(110, now + 0.15);
      gain2.gain.setValueAtTime(0.3, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.4);
    }

    const BABY_HAPPY_IMG = `<img class="baby-img" src="./cuoi.png" alt="Bé Cười" style="width: 100px; height: 100px">`;
    const BABY_SAD_IMG = `<img class="baby-img" src="./khoc.png" alt="Bé Buồn" style="width: 100px; height: 100px">`;

    let currentMode = 1;
    let currentCorrectAnswer = null;
    let isProcessing = false;

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-button').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === mode);
      });
      clearCanvas();
      
      const instr = document.getElementById('instruction-text');
      if (mode === 1) instr.innerText = "Chọn đáp án đúng để hoàn thành phép tính nhé!";
      else if (mode === 2) instr.innerText = "Bé hãy đếm số lượng hình vẽ và chọn con số đúng!";
      else if (mode === 3) instr.innerText = "Bé hãy chọn hình bên dưới liên quan nhất với hình phía trên!";

      nextQuestion();
    }

    function clearCanvas() {
      document.getElementById('svg-canvas').innerHTML = '';
    }

    function showBabyOverlay(isHappy, callback) {
      const overlay = document.getElementById('baby-overlay');
      const box = document.getElementById('baby-box');
      
      if (isHappy) {
        box.innerHTML = `${BABY_HAPPY_IMG}<div class="baby-title happy">BÉ GIỎI QUÁ! ✨</div>`;
      } else {
        box.innerHTML = `${BABY_SAD_IMG}<div class="baby-title sad">THỬ LẠI NHÉ! 🥺</div>`;
      }

      overlay.classList.add('show');
      setTimeout(() => {
        overlay.classList.remove('show');
        if (callback) callback();
      }, 2300);
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffleArray(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function nextQuestion() {
      isProcessing = false;
      clearCanvas();
      const container = document.getElementById('content-container');
      container.innerHTML = '';

      if (currentMode === 1) generateMathQuestion(container);
      else if (currentMode === 2) generateCountQuestion(container);
      else if (currentMode === 3) generateMatchQuestion(container);
    }

    function generateMathQuestion(container) {
      const isAddition = Math.random() > 0.5;
      let num1, num2, result;

      if (isAddition) {
        num1 = getRandomInt(1, 8);
        num2 = getRandomInt(1, 9 - num1);
        result = num1 + num2;
      } else {
        num1 = getRandomInt(2, 9);
        num2 = getRandomInt(1, num1);
        result = num1 - num2;
      }

      const hidePos = getRandomInt(0, 2);
      let questionText = "";

      if (hidePos === 0) {
        questionText = `? ${isAddition ? '+' : '-'} ${num2} = ${result}`;
        currentCorrectAnswer = num1;
      } else if (hidePos === 1) {
        questionText = `${num1} ${isAddition ? '+' : '-'} ? = ${result}`;
        currentCorrectAnswer = num2;
      } else {
        questionText = `${num1} ${isAddition ? '+' : '-'} ${num2} = ?`;
        currentCorrectAnswer = result;
      }

      const qCard = document.createElement('div');
      qCard.className = 'flashcard question-card';
      qCard.innerText = questionText;
      container.appendChild(qCard);

      let options = [currentCorrectAnswer];
      while (options.length < 4) {
        let dummy = getRandomInt(0, 10);
        if (!options.includes(dummy)) options.push(dummy);
      }
      options = shuffleArray(options);

      const grid = document.createElement('div');
      grid.className = 'answers-grid';
      options.forEach(opt => {
        const aCard = document.createElement('div');
        aCard.className = 'flashcard answer-card';
        aCard.innerText = opt;
        aCard.onclick = () => handleAnswer(aCard, opt === currentCorrectAnswer);
        grid.appendChild(aCard);
      });
      container.appendChild(grid);
    }

    function generateCountQuestion(container) {
      const count = getRandomInt(1, 8);
      currentCorrectAnswer = count;

      const randomImgTag = IMG_COUNT_ITEMS[getRandomInt(0, IMG_COUNT_ITEMS.length - 1)];

      const qCard = document.createElement('div');
      qCard.className = 'flashcard question-card';
      
      const gridObjs = document.createElement('div');
      gridObjs.className = 'objects-grid';
      for (let i = 0; i < count; i++) gridObjs.innerHTML += randomImgTag;
      qCard.appendChild(gridObjs);
      container.appendChild(qCard);

      let options = [currentCorrectAnswer];
      while (options.length < 4) {
        let dummy = getRandomInt(1, 9);
        if (!options.includes(dummy)) options.push(dummy);
      }
      options = shuffleArray(options);

      const grid = document.createElement('div');
      grid.className = 'answers-grid';
      options.forEach(opt => {
        const aCard = document.createElement('div');
        aCard.className = 'flashcard answer-card';
        aCard.innerText = opt;
        aCard.onclick = () => handleAnswer(aCard, opt === currentCorrectAnswer);
        grid.appendChild(aCard);
      });
      container.appendChild(grid);
    }

    function generateMatchQuestion(container) {
      const pair = MATCH_PAIRS[getRandomInt(0, MATCH_PAIRS.length - 1)];

      const topCard = document.createElement('div');
      topCard.className = 'flashcard question-card match-mode';
      topCard.innerHTML = `${pair.target.img}<div class="label-text">${pair.target.name}</div>`;
      container.appendChild(topCard);

      let choices = [
        { ...pair.correct, isCorrect: true },
        ...pair.wrong.map(item => ({ ...item, isCorrect: false }))
      ];
      choices = shuffleArray(choices);

      const grid = document.createElement('div');
      grid.className = 'answers-grid';
      choices.forEach((choice) => {
        const aCard = document.createElement('div');
        aCard.className = 'flashcard answer-card match-card';
        aCard.innerHTML = `${choice.img}<div class="label-text">${choice.name}</div>`;
        aCard.onclick = () => handleMatchAnswer(aCard, choice.isCorrect, topCard);
        grid.appendChild(aCard);
      });
      container.appendChild(grid);
    }

    function handleAnswer(cardElement, isCorrect) {
      if (isProcessing) return;
      isProcessing = true;

      if (isCorrect) {
        playTingTing();
        cardElement.classList.add('correct');
        showBabyOverlay(true, () => nextQuestion());
      } else {
        playDetDet();
        cardElement.classList.add('wrong');
        showBabyOverlay(false, () => {
          cardElement.classList.remove('wrong');
          isProcessing = false;
        });
      }
    }

    function handleMatchAnswer(cardElement, isCorrect, targetCard) {
      if (isProcessing) return;
      isProcessing = true;

      if (isCorrect) {
        playTingTing();
        drawLineBetweenCards(targetCard, cardElement);
        cardElement.classList.add('correct');
        showBabyOverlay(true, () => nextQuestion());
      } else {
        playDetDet();
        cardElement.classList.add('wrong');
        showBabyOverlay(false, () => {
          cardElement.classList.remove('wrong');
          isProcessing = false;
        });
      }
    }

    function drawLineBetweenCards(card1, card2) {
      const svg = document.getElementById('svg-canvas');
      const gameArea = document.getElementById('game-area');
      const areaRect = gameArea.getBoundingClientRect();
      const rect1 = card1.getBoundingClientRect();
      const rect2 = card2.getBoundingClientRect();

      const x1 = rect1.left + rect1.width / 2 - areaRect.left;
      const y1 = rect1.top + rect1.height / 2 - areaRect.top;
      const x2 = rect2.left + rect2.width / 2 - areaRect.left;
      const y2 = rect2.top + rect2.height / 2 - areaRect.top;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', '#2ECC71');
      line.setAttribute('stroke-width', '5');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('stroke-dasharray', '6,6');

      svg.appendChild(line);
    }

    window.onload = () => switchMode(1);
  </script>
</body>
</html>
