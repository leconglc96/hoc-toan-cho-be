<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Toán Mầm Non - Học Mà Chơi</title>
  <style>
    :root {
      --primary-color: #FF5252;
      --secondary-color: #4A90E2;
      --accent-color: #2ECC71;
      --text-color: #2D3748;
      --correct-color: #2ECC71;
      --wrong-color: #FF4757;
      --font-main: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Dynamic viewport height for modern browsers */
      overflow: hidden;
      font-family: var(--font-main);
      background: linear-gradient(135deg, #E0F7FA 0%, #FFF9C4 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      position: relative;
    }

    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      flex-shrink: 0;
      gap: 8px;
    }

    h1 {
      font-family: var(--font-main);
      font-weight: bold;
      color: #FF4757;
      font-size: clamp(1rem, 4vw, 1.4rem);
      text-shadow: 1px 1px 0px #FFF, 2px 2px 0px rgba(0,0,0,0.1);
      white-space: nowrap;
    }

    .tab-container {
      display: flex;
      gap: 6px;
    }

    .tab-button {
      font-family: var(--font-main);
      font-weight: bold;
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      padding: 6px 10px;
      border: 2px solid #FFF;
      border-radius: 18px;
      background: var(--secondary-color);
      color: white;
      cursor: pointer;
      box-shadow: 0 3px 0 #2980B9, 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .tab-button:nth-child(2) {
      background: #FF6B6B;
      box-shadow: 0 3px 0 #C0392B, 0 4px 6px rgba(0,0,0,0.1);
    }

    .tab-button:nth-child(3) {
      background: #2ECC71;
      box-shadow: 0 3px 0 #27AE60, 0 4px 6px rgba(0,0,0,0.1);
    }

    .tab-button.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
      filter: brightness(1.1);
    }

    .game-area {
      width: 100%;
      max-width: 960px;
      height: calc(100dvh - 60px);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 3px solid #FFF;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .instruction {
      font-size: clamp(0.8rem, 2.8vw, 0.95rem);
      font-weight: bold;
      color: #2C3E50;
      text-align: center;
      background: #FFF9C4;
      padding: 4px 12px;
      border-radius: 12px;
      border: 2px dashed #FBC02D;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 100%;
      word-break: break-word;
    }

    #content-container {
      width: 100%;
      height: calc(100% - 36px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      gap: 8px;
    }

    .flashcard {
      background: #FFFFFF;
      border-radius: 18px;
      border: 4px solid #E0E0E0;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color 0.2s;
    }

    .question-card {
      padding: 6px 12px;
      width: 80%;
      max-width: 480px;
      height: 38%;
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: bold;
      color: #2C3E50;
      border-color: #4A90E2;
      background: linear-gradient(180deg, #EBF5FB 0%, #FFFFFF 100%);
    }

    .question-card.match-mode {
      border-color: #FF9800;
      background: linear-gradient(180deg, #FFF8E1 0%, #FFFFFF 100%);
      width: 60%;
      max-width: 320px;
      height: 44%;
    }

    .objects-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .item-svg {
      width: clamp(36px, 10vw, 50px);
      height: clamp(36px, 10vw, 50px);
      filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.18));
      animation: popIn 0.3s ease-out;
    }

    .item-svg-large {
      width: clamp(48px, 14vw, 70px);
      height: clamp(48px, 14vw, 70px);
      filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.2));
    }

    .answers-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 95%;
      max-width: 820px;
      height: 48%;
    }

    /* Adjust to 4 columns on landscape or larger mobile screens */
    @media (min-width: 480px) or (orientation: landscape) {
      .answers-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      .question-card {
        width: 60%;
      }
    }

    .answer-card {
      height: 100%;
      cursor: pointer;
      font-size: clamp(1.8rem, 6vw, 2.2rem);
      font-weight: bold;
      color: #2C3E50;
      border-color: #FF8A80;
      background: #FFF;
      box-shadow: 0 4px 0 #FFCDD2, 0 6px 10px rgba(0,0,0,0.1);
      transition: transform 0.15s;
    }

    .answer-card:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #FFCDD2;
    }

    .answer-card.match-card {
      font-family: var(--font-main);
      font-size: clamp(0.75rem, 2.5vw, 0.95rem);
      font-weight: bold;
      color: #2C3E50;
      padding: 4px;
    }

    .answer-card.correct {
      border-color: var(--correct-color) !important;
      background-color: #E8F5E9 !important;
      animation: spinCard 0.75s ease-in-out 2 forwards !important;
    }

    .answer-card.wrong {
      border-color: var(--wrong-color) !important;
      background-color: #FFEBEE !important;
      animation: bounceCard 0.35s ease-in-out 2 !important;
    }

    @keyframes spinCard {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes bounceCard {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-10px); }
      75% { transform: translateY(5px); }
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      80% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    #svg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .label-text {
      margin-top: 2px;
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      font-weight: bold;
      color: #2C3E50;
      text-align: center;
    }

    .baby-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .baby-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .baby-box {
      background: white;
      padding: 15px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.18);
      border: 5px solid #4ECDC4;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.35s ease-out;
      max-width: 90%;
    }

    .baby-svg {
      width: clamp(80px, 20vw, 110px);
      height: clamp(80px, 20vw, 110px);
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }

    .baby-title {
      font-family: var(--font-main);
      font-weight: bold;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      margin-top: 8px;
      text-align: center;
    }

    .baby-title.happy { color: #2ECC71; }
    .baby-title.sad { color: #FF4757; }
  </style>
</head>

  <header>
    <h1>TOÁN MẦM NON</h1>
    <div class="tab-container">
      <button class="tab-button active" onclick="switchMode(1)">1. Phép Tính</button>

      <div class="baby-box" id="baby-box"></div>

  <script>
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTingTing() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(987.77, now);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.3);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1318.51, now + 0.15);
      gain2.gain.setValueAtTime(0.4, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.6);
    }

    function playDetDet() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(150, now);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.2);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(110, now + 0.15);
      gain2.gain.setValueAtTime(0.3, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.4);
    }

    let currentCorrectAnswer = null;

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-button').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === mode);
      });
      clearCanvas();
      
      const instr = document.getElementById('instruction-text');
      if (mode === 1) instr.innerText = "Chọn đáp án đúng để hoàn thành phép tính nhé!";
      else if (mode === 2) instr.innerText = "Bé hãy đếm số lượng hình vẽ và chọn con số đúng!";
      else if (mode === 3) instr.innerText = "Bé hãy chọn hình bên dưới liên quan nhất với hình phía trên!";

      nextQuestion();
    }

    function clearCanvas() {
      document.getElementById('svg-canvas').innerHTML = '';
    }

    function showBabyOverlay(isHappy, callback) {
      const overlay = document.getElementById('baby-overlay');
      const box = document.getElementById('baby-box');
      
      if (isHappy) {
        box.innerHTML = `${BABY_HAPPY_SVG}<div class="baby-title happy">BÉ GIỎI QUÁ! ✨</div>`;
      } else {
        box.innerHTML = `${BABY_SAD_SVG}<div class="baby-title sad">THỬ LẠI NHÉ! 🥺</div>`;
      }

      overlay.classList.add('show');
      setTimeout(() => {
        overlay.classList.remove('show');
        if (callback) callback();
      }, 2500);
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffleArray(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function nextQuestion() {
      isProcessing = false;
      clearCanvas();
      const container = document.getElementById('content-container');
      container.innerHTML = '';

      if (currentMode === 1) generateMathQuestion(container);
      else if (currentMode === 2) generateCountQuestion(container);
      else if (currentMode === 3) generateMatchQuestion(container);
    }

    function generateMathQuestion(container) {
      const isAddition = Math.random() > 0.5;
      let num1, num2, result;

      if (isAddition) {
        num1 = getRandomInt(1, 8);
        num2 = getRandomInt(1, 9 - num1);
        result = num1 + num2;
      } else {
        num1 = getRandomInt(2, 9);
        num2 = getRandomInt(1, num1);
        result = num1 - num2;
      }

      const hidePos = getRandomInt(0, 2);
      let questionText = "";

      if (hidePos === 0) {
        questionText = `? ${isAddition ? '+' : '-'} ${num2} = ${result}`;
        currentCorrectAnswer = num1;
      } else if (hidePos === 1) {
        questionText = `${num1} ${isAddition ? '+' : '-'} ? = ${result}`;
        currentCorrectAnswer = num2;
      } else {
        questionText = `${num1} ${isAddition ? '+' : '-'} ${num2} = ?`;
        currentCorrectAnswer = result;
      }

      const qCard = document.createElement('div');
      qCard.className = 'flashcard question-card';
      qCard.innerText = questionText;
      container.appendChild(qCard);

      let options = [currentCorrectAnswer];
      while (options.length < 4) {
        let dummy = getRandomInt(0, 10);
        if (!options.includes(dummy)) options.push(dummy);
      }
      options = shuffleArray(options);

      const grid = document.createElement('div');
      grid.className = 'answers-grid';
      options.forEach(opt => {
        const aCard = document.createElement('div');
        aCard.className = 'flashcard answer-card';
        aCard.innerText = opt;
        aCard.onclick = () => handleAnswer(aCard, opt === currentCorrectAnswer);
        grid.appendChild(aCard);
      });
      container.appendChild(grid);
    }

    function generateCountQuestion(container) {
      const count = getRandomInt(1, 8);
      currentCorrectAnswer = count;

      const keys = Object.keys(SVG_ITEMS);
      const randomKey = keys[getRandomInt(0, keys.length - 1)];
      const svgIcon = SVG_ITEMS[randomKey];

      const qCard = document.createElement('div');
      qCard.className = 'flashcard question-card';
      
      const gridObjs = document.createElement('div');
      gridObjs.className = 'objects-grid';
      for (let i = 0; i < count; i++) gridObjs.innerHTML += svgIcon;
      qCard.appendChild(gridObjs);
      container.appendChild(qCard);

      let options = [currentCorrectAnswer];
      while (options.length < 4) {
        let dummy = getRandomInt(1, 9);
        if (!options.includes(dummy)) options.push(dummy);
      }
      options = shuffleArray(options);

      const grid = document.createElement('div');
      grid.className = 'answers-grid';
      options.forEach(opt => {
        const aCard = document.createElement('div');
        aCard.className = 'flashcard answer-card';
        aCard.innerText = opt;
        aCard.onclick = () => handleAnswer(aCard, opt === currentCorrectAnswer);
        grid.appendChild(aCard);
      });
      container.appendChild(grid);
    }

    function generateMatchQuestion(container) {
      const pair = MATCH_PAIRS[getRandomInt(0, MATCH_PAIRS.length - 1)];

      const topCard = document.createElement('div');
      topCard.className = 'flashcard question-card match-mode';
      topCard.innerHTML = `${pair.target.svg}<div class="label-text">${pair.target.name}</div>`;
      container.appendChild(topCard);

      let choices = [
        { ...pair.correct, isCorrect: true },
        ...pair.wrong.map(item => ({ ...item, isCorrect: false }))
      ];
      choices = shuffleArray(choices);

      const grid = document.createElement('div');
      grid.className = 'answers-grid';
      choices.forEach((choice) => {
        const aCard = document.createElement('div');
        aCard.className = 'flashcard answer-card match-card';
        aCard.innerHTML = `${choice.svg}<div class="label-text">${choice.name}</div>`;
        aCard.onclick = () => handleMatchAnswer(aCard, choice.isCorrect, topCard);
        grid.appendChild(aCard);
      });
      container.appendChild(grid);
    }

    function handleAnswer(cardElement, isCorrect) {
      if (isProcessing) return;
      isProcessing = true;

      if (isCorrect) {
        playTingTing();
        cardElement.classList.add('correct');
        showBabyOverlay(true, () => nextQuestion());
      } else {
        playDetDet();
        cardElement.classList.add('wrong');
        showBabyOverlay(false, () => {
          cardElement.classList.remove('wrong');
          isProcessing = false;
        });
      }
    }

    function handleMatchAnswer(cardElement, isCorrect, targetCard) {
      if (isProcessing) return;
      isProcessing = true;

      if (isCorrect) {
        playTingTing();
        drawLineBetweenCards(targetCard, cardElement);
        cardElement.classList.add('correct');
        showBabyOverlay(true, () => nextQuestion());
      } else {
        playDetDet();
        cardElement.classList.add('wrong');
        showBabyOverlay(false, () => {
          cardElement.classList.remove('wrong');
          isProcessing = false;
        });
      }
    }

    function drawLineBetweenCards(card1, card2) {
      const svg = document.getElementById('svg-canvas');
      const gameArea = document.getElementById('game-area');
      const areaRect = gameArea.getBoundingClientRect();
      const rect1 = card1.getBoundingClientRect();
      const rect2 = card2.getBoundingClientRect();

      const x1 = rect1.left + rect1.width / 2 - areaRect.left;
      const y1 = rect1.top + rect1.height / 2 - areaRect.top;
      const x2 = rect2.left + rect2.width / 2 - areaRect.left;
      const y2 = rect2.top + rect2.height / 2 - areaRect.top;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', '#2ECC71');
      line.setAttribute('stroke-width', '6');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('stroke-dasharray', '8,8');

      svg.appendChild(line);
    }

    // Redraw SVG line if window resizes
    window.onresize = () => {
      clearCanvas();
    };

    window.onload = () => switchMode(1);
  </script>
</body>
</html>
